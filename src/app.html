<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
	<meta name="theme-color" content="#fafafa" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<meta name="apple-mobile-web-app-title" content="Rhythm Trainer" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="text-scale" content="scale" />

	<title>Rhythm Trainer</title>
	<meta name="description"
		content="Rhythm trainer for both hands with a metronome — build patterns and share them by link." />

	<meta property="og:type" content="website" />
	<meta property="og:title" content="Rhythm Trainer" />
	<meta property="og:description"
		content="Rhythm trainer for both hands with a metronome — build patterns and share them by link." />
	<meta property="og:url" content="https://so0shka.github.io/rhythm-trainer-app/" />
	<meta property="og:image" content="https://so0shka.github.io/rhythm-trainer-app/og.png" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />

	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="Rhythm Trainer" />
	<meta name="twitter:description"
		content="Rhythm trainer for both hands with a metronome — build patterns and share them by link." />
	<meta name="twitter:image" content="https://so0shka.github.io/rhythm-trainer-app/og.png" />

	<style>
		@font-face {
			font-family: 'Bravura';
			src: url('%sveltekit.assets%/fonts/Bravura.woff2') format('woff2');
			font-display: block;
		}
	</style>
	<script>
		// Capture Chrome's install prompt as early as possible: it can fire before
		// the app's JS mounts, and a missed event is gone for good. The InstallButton
		// component reads this back on mount.
		window.addEventListener('beforeinstallprompt', function (e) {
			e.preventDefault();
			window.deferredInstallPrompt = e;
			window.dispatchEvent(new Event('installpromptready'));
		});
	</script>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
